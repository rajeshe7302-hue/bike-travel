<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Successful - BikeTravel</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .success-box {
            background: white;
            padding: 45px 35px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 500px;
            width: 90%;
        }

        .success-icon {
            font-size: 60px;
        }

        h1 {
            color: #222;
            margin: 15px 0;
        }

        p {
            color: #666;
            font-size: 17px;
            line-height: 1.6;
        }

        .home-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 25px;
            background: #ff6b00;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .home-btn:hover {
            background: #e65c00;
        }
    </style>
</head>

<body>

    <div class="success-box">

        <div class="success-icon">✅</div>

        <h1>Booking Received!</h1>

        <p>
            Thank you for choosing BikeTravel.
            Your booking request has been successfully received.
        </p>

        <p>
            🏍️ We will contact you soon with the booking details.
        </p>

        <a href="index.html" class="home-btn">
            🏠 Back to Home
        </a>

    </div>

</body>
</html>
